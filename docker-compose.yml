# Start:  docker compose up --build
# Needs a .env file (copy .env.example) with at least POSTGRES_PASSWORD and STAFF_API_KEY.
# Tracking server (optional):  docker compose --profile tracking up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: supportx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: supportx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportx -d supportx"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://supportx:${POSTGRES_PASSWORD}@db:5432/supportx
      STAFF_API_KEY: ${STAFF_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The container defaults to APP_ENV=production, which does NOT create tables
      # (no Alembic migrations exist yet). For a first local run set APP_ENV=development in .env.
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts/models:/app/artifacts/models:ro
      - apistate:/app/state

  mlflow:
    profiles: ["tracking"]
    image: python:3.12-slim
    command: >
      sh -c "pip install --no-cache-dir mlflow~=3.18.0 &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri sqlite:////mlflow/mlflow.db
             --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflowdata:/mlflow

volumes:
  pgdata:
  apistate:
  mlflowdata:
