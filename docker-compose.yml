# Start:  docker compose up --build
# Needs a .env file (copy .env.example) with at least POSTGRES_PASSWORD and STAFF_API_KEY.
# Tracking server (optional):  docker compose --profile tracking up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: supportx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: supportx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportx -d supportx"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://supportx:${POSTGRES_PASSWORD}@db:5432/supportx
      STAFF_API_KEY: ${STAFF_API_KEY:-}
      STAFF_API_KEYS: ${STAFF_API_KEYS:-}
      BUSINESS_RULES_VERSION: ${BUSINESS_RULES_VERSION:-demo-1}
      REFUND_RETURN_WINDOW_DAYS: ${REFUND_RETURN_WINDOW_DAYS:-30}
      REFUND_NOT_RECEIVED_AFTER_DAYS: ${REFUND_NOT_RECEIVED_AFTER_DAYS:-14}
      BUSINESS_RULES_CONFIRMED: ${BUSINESS_RULES_CONFIRMED:-false}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.2}
      INTEGRATIONS_MODE: ${INTEGRATIONS_MODE:-disabled}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-65536}
      LLM_REPLIES_ENABLED: ${LLM_REPLIES_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Tables come from Alembic migrations (run at container start), not from the app.
      APP_ENV: ${APP_ENV:-production}
    # Apply migrations, then start the server (fine for one API container; with several,
    # run `alembic upgrade head` as a separate one-off step instead).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn supportx.api.app:create_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts/models:/app/artifacts/models:ro
      - apistate:/app/state

  mlflow:
    profiles: ["tracking"]
    image: python:3.12-slim
    command: >
      sh -c "pip install --no-cache-dir mlflow~=3.18.0 &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri sqlite:////mlflow/mlflow.db
             --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflowdata:/mlflow

volumes:
  pgdata:
  apistate:
  mlflowdata:
